[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credfuzz-hgt"
version = "1.0.0"
description = "Cost-sensitive fuzzy hierarchical graph Transformer for credit default prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alaa Asim Qaffas"}]
dependencies = [
  "numpy==2.1.3", "pandas==2.2.3", "scikit-learn==1.5.2",
  "torch==2.5.1", "PyYAML==6.0.2", "requests==2.32.3",
  "openpyxl==3.1.5", "xlrd==2.0.1", "joblib==1.4.2"
]

[project.optional-dependencies]
baselines = ["xgboost==2.1.2", "lightgbm==4.5.0", "catboost==1.2.7"]
dev = ["pytest==8.3.3", "ruff==0.7.3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
